name: Deploy web version (GitHub Pages)

# Result: https://<your-user>.github.io/<repo>/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js icon-*.png css js _site/
          [ -d download ] && cp -r download _site/ || true
          [ -d images ] && cp -r images _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
